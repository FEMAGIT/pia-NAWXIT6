[uwsgi]
uid = dyrmed2
gid = dyrmed2
chdir = /home/videocall
home = /home/videocall/venv
module =  Ticketing_V2.wsgi:application
env = DJANGO_SETTINGS_MODULE=Ticketing_V2.settings
master = true
processes = 5
socket = /run/uwsgi/videocall.sock
logto = /var/log/uwsgi/videocall.log
chown-socket = dyrmed2:dyrmed2
chmod-socket = 664
vacuum = true
buffer-size=65535
