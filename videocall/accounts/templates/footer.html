<!--Loader Animation Script-->
<script type="text/javascript">

    function showLoader(content_to_disable, form_to_submit) {
        console.log(content_to_disable);
        console.log(form_to_submit);

        var form = document.getElementById(form_to_submit);

        if (content_to_disable == 'ticket_editor') {
            document.getElementById("myModal").style.display = 'none';
        }

        var loader = document.getElementById("loader_animation");
        loader.style.display = 'block';
        var content = document.getElementById(content_to_disable);
        content.classList.add('disabledButton');

        form.submit();
    }

</script>
<!-- End Loader Animation Script -->

{% if alert_msg is not None %}
<div id="alert_msg" onclick="hide('alert_msg')" class="page-message" role="alert" style="display:none">
    <i class="fa fa-fw fa-exclamation-triangle"></i>&nbsp;
    <strong>ATTENZIONE:</strong>
    &ensp; <span id="alert_msg_text">{{ alert_msg }}</span>
    <a class="btn btn-sm btn-icon btn-warning ml-1" aria-label="Close" onclick="$(this).parent().fadeOut()">
        <span aria-hidden="true"><i class="fa fa-times"></i></span>
    </a>
</div>

<script>


    document.addEventListener('DOMContentLoaded', function () {
        if (document.getElementById("alert_msg").textContent.includes(":)")) {
            $("#alert_msg").css("background-color", "var(--success)").css("color", "white");
            $("#alert_msg > i").removeClass("fa fa-fw fa-exclamation-triangle").addClass("oi oi-thumb-up");
            $("#alert_msg > a").removeClass("btn-warning");
            $("#alert_msg > strong").text($("#alert_msg > strong").text().replace('ATTENZIONE', 'OTTIMO '));
            $("#alert_msg_text").text($("#alert_msg_text").text().replace(':)', ''));
        }
        if (document.getElementById("alert_msg").textContent.includes(":(")) {
            $("#alert_msg").css("background-color", "var(--red)").css("color", "white");
            $("#alert_msg > i").removeClass("fa fa-fw fa-exclamation-triangle").addClass("fa fa-fw fa-times");
            $("#alert_msg > a").removeClass("btn-warning");
            $("#alert_msg > strong").text($("#alert_msg > strong").text().replace('ATTENZIONE', 'ERRORE '));
            $("#alert_msg_text").text($("#alert_msg_text").text().replace(':(', ''));
        }

        if ($("#alert_msg_text").text() != "") {
            $("#alert_msg").fadeIn();
        }

    });


    var seconds = 5;

    function fade(element) {
        var op = 1;  // initial opacity
        var timer = setInterval(function () {
            if (op <= 0.1) {
                clearInterval(timer);
                element.style.display = 'none';
            }
            element.style.opacity = op;
            element.style.filter = 'alpha(opacity=' + op * 100 + ")";
            op -= op * 0.1;
        }, 50);
    }

    function hide_div() {
        fade(document.getElementById("alert_msg"));
    }

    //  setTimeout("hide_div()", 1000 * seconds);
</script>

{% endif %}

<script>
    function getCookie(name) {
        var cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var cookie = cookies[i].trim();
                // Does this cookie string begin with the name we want?
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

</script>
